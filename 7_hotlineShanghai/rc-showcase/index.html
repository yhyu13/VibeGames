<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RC Showcase — Hotline Shanghai</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0d0b12;
        color: #e8e3d8;
        font: 13px/1.5 "Cascadia Mono", Consolas, monospace;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: #16121f;
        border-bottom: 1px solid #2a2438;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        color: #ffb066;
      }
      #status {
        font-size: 12px;
        color: #9a91b8;
      }
      #main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 12px;
        padding: 12px 16px;
      }
      #view {
        width: 100%;
        max-width: 960px;
        image-rendering: pixelated;
        background: #000;
        border: 1px solid #2a2438;
        border-radius: 4px;
      }
      #controls {
        background: #12101a;
        border: 1px solid #2a2438;
        border-radius: 4px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-self: start;
      }
      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      select,
      input[type="number"] {
        background: #1d1828;
        color: #e8e3d8;
        border: 1px solid #3a314f;
        border-radius: 3px;
        padding: 3px 6px;
        width: 90px;
      }
      #stages {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 0 16px 16px;
      }
      .stage {
        background: #12101a;
        border: 1px solid #2a2438;
        border-radius: 4px;
        padding: 6px;
      }
      .stage b {
        display: block;
        font-size: 11px;
        color: #9a91b8;
        margin-bottom: 4px;
      }
      .stage canvas {
        width: 100%;
        image-rendering: pixelated;
        background: #000;
      }
      #probes {
        padding: 0 16px 20px;
        color: #c9c3d8;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RC Showcase · 1937 上海客厅（src/engine/RcPipeline）</h1>
      <div id="status">启动中…</div>
    </header>
    <div id="main">
      <canvas id="view" width="480" height="216"></canvas>
      <div id="controls">
        <label>cascade
          <select id="cascade">
            <option value="0">0（关闭）</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label>baseInterval
          <input id="interval" type="number" min="0.5" max="8" step="0.25" value="1.5" />
        </label>
        <label>lightScale
          <input id="lightScale" type="number" min="0" max="4" step="0.05" value="1.35" />
        </label>
        <label>ambient
          <input id="ambient" type="number" min="0" max="0.5" step="0.01" value="0.02" />
        </label>
        <label><input id="dither" type="checkbox" checked /> dither 回压</label>
        <label><input id="twoLoop" type="checkbox" checked /> 两轮 cascade</label>
        <label><input id="pulse" type="checkbox" checked /> 霓虹/探照灯脉动</label>
      </div>
    </div>
    <div id="stages">
      <div class="stage"><b>① sceneSeed</b><canvas id="stageSeed"></canvas></div>
      <div class="stage"><b>④ sceneSdf</b><canvas id="stageSdf"></canvas></div>
      <div class="stage"><b>⑤ radiance（×3）</b><canvas id="stageRadiance"></canvas></div>
      <div class="stage"><b>⑥ final</b><canvas id="stageFinal"></canvas></div>
    </div>
    <div id="probes">…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

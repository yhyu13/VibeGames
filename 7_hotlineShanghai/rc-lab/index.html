<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RC Lab — Hotline Shanghai</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0d0b12;
        color: #e8e3d8;
        font: 13px/1.5 "Cascadia Mono", Consolas, monospace;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: #16121f;
        border-bottom: 1px solid #2a2438;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        color: #ffb066;
      }
      .status {
        padding: 2px 10px;
        border-radius: 3px;
        font-size: 12px;
      }
      .status.ok {
        background: #15351f;
        color: #7ee787;
      }
      .status.bad {
        background: #4a1520;
        color: #ff7b72;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        background: #120f1a;
        border-bottom: 1px solid #241e33;
      }
      select,
      input,
      button {
        background: #1d1828;
        color: #e8e3d8;
        border: 1px solid #3a314f;
        border-radius: 3px;
        padding: 4px 8px;
        font: inherit;
      }
      button:hover {
        border-color: #ffb066;
      }
      #stageViews {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px 16px;
      }
      .stage {
        background: #12101a;
        border: 1px solid #2a2438;
        border-radius: 4px;
        padding: 6px;
      }
      .stage canvas {
        width: 100%;
        image-rendering: pixelated;
        background: #000;
        border-radius: 2px;
      }
      .stage b {
        display: block;
        font-size: 11px;
        color: #9a91b8;
        margin-bottom: 4px;
      }
      #report {
        padding: 6px 16px 24px;
        max-width: 1200px;
      }
      .scene {
        margin-top: 10px;
        padding: 6px 8px;
        border-radius: 4px;
        border-left: 3px solid #555;
      }
      .scene.pass {
        background: #122016;
        border-left-color: #3fb950;
      }
      .scene.fail {
        background: #241216;
        border-left-color: #f85149;
      }
      .check {
        padding: 1px 0 1px 14px;
        color: #c9c3d8;
      }
      .check.pass {
        color: #7ee787;
      }
      .check.fail {
        color: #ff7b72;
      }
      .dim {
        color: #8a83a0;
        font-size: 11px;
      }
      .summary {
        margin-top: 14px;
        padding: 8px;
        border-radius: 4px;
        font-weight: bold;
      }
      .summary.pass {
        background: #15351f;
        color: #7ee787;
      }
      .summary.fail {
        background: #4a1520;
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RC Lab · 2D Radiance Cascades 算法测试台</h1>
      <div id="status" class="status">初始化中…</div>
    </header>
    <div id="controls">
      <label>场景
        <select id="sceneSelect">
          <option value="empty-lamp">S1 空房单灯</option>
          <option value="wall-shadow">S2 墙影</option>
          <option value="two-lights">S3 双色灯 + 合并回归</option>
          <option value="furniture-room" selected>S4 家具房间</option>
          <option value="muzzle-flash">S5 枪火瞬光</option>
          <option value="stress">S6 压力（16 灯）</option>
        </select>
      </label>
      <label>cascade
        <select id="cascadeSelect">
          <option value="3">3（默认）</option>
          <option value="2">2</option>
          <option value="1">1</option>
          <option value="0">0（关闭）</option>
        </select>
      </label>
      <label>baseInterval
        <input id="intervalInput" type="number" min="0.25" max="8" step="0.25" value="1.5" style="width:70px" />
      </label>
      <label><input id="ditherCheck" type="checkbox" /> dither</label>
      <button id="runSceneBtn">运行当前场景</button>
      <button id="runAllBtn">运行全部场景</button>
      <button id="portCheckBtn">验证 src/engine 移植版</button>
    </div>
    <div id="stageViews">
      <div class="stage"><b>① sceneSeed（白=空 黑=墙 彩=光）</b><canvas id="stageSeed"></canvas></div>
      <div class="stage"><b>④ sceneSdf（距离场）</b><canvas id="stageSdf"></canvas></div>
      <div class="stage"><b>⑤ sceneRadiance（×3 增强显示）</b><canvas id="stageRadiance"></canvas></div>
      <div class="stage"><b>⑥ final（base + radiance）</b><canvas id="view" width="480" height="270"></canvas></div>
    </div>
    <div id="report"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RC Intro Copy — Hotline Shanghai</title>
  <style>
    :root { color-scheme: dark; --ink:#09080d; --panel:#121019; --line:#312a3c; --amber:#ffb15c; --paper:#e8dfd0; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 50% 0,#241420 0,var(--ink) 55%); color:var(--paper); font:12px/1.5 Consolas,monospace }
    header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:#120e18 } h1 { margin:0; color:var(--amber); font-size:15px }
    main { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:12px; padding:12px 16px } #view { width:100%; max-width:960px; aspect-ratio:10/9; background:#000; image-rendering:pixelated; border:1px solid var(--line) }
    aside,.stage { background:var(--panel); border:1px solid var(--line); padding:10px } aside { display:grid; gap:8px; align-content:start } label { display:flex; justify-content:space-between; gap:8px; align-items:center }
    button,select,input { background:#221a2d; border:1px solid #50415e; color:var(--paper); padding:5px 8px } button.active { background:#7c4524; color:#fff1cf }
    .row { display:flex; gap:5px; flex-wrap:wrap } #stages { display:grid; grid-template-columns:repeat(7,1fr); gap:7px; padding:0 16px 10px } .stage { padding:5px } .stage b { display:block; color:#aaa0b8; margin-bottom:4px } .stage canvas { width:100%; aspect-ratio:10/9; background:#000; image-rendering:pixelated }
    #probes { margin:0 16px 16px; padding:10px; white-space:pre-wrap; border:1px solid var(--line); background:#0e0c13; color:#c9c1d2 }
    @media(max-width:850px){main{grid-template-columns:1fr}#stages{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header><h1>RC INTRO COPY · 弄堂油灯</h1><span id="status">starting…</span></header>
  <main><canvas id="view" width="480" height="432"></canvas><aside>
    <b>灯状态</b><div class="row" id="lampButtons"><button data-lamp="intact" class="active">完整</button><button data-lamp="damaged">破损</button><button data-lamp="broken">熄灭</button></div>
    <label>手电方向 <input id="angle" type="range" min="-3.14" max="3.14" step="0.05" value="0"></label>
    <label>自动扫动 <input id="animate" type="checkbox"></label><label>敌人手电 <input id="flashlight" type="checkbox" checked></label>
    <label>玩家遮挡 <input id="playerBlocker" type="checkbox" checked></label><label>敌人遮挡 <input id="enemyBlocker" type="checkbox" checked></label><label>沙袋遮挡 <input id="sandbags" type="checkbox" checked></label>
    <label>cascade <select id="cascade"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
    <label>light scale <input id="lightScale" type="number" min="0" max="4" step=".1" value="1.6"></label>
    <button id="spark">火花闪光 75ms</button><small>真实 RcPipeline · dither OFF<br>墙 / 沙袋 / 玩家 / 敌人进入 occlusion</small>
  </aside></main>
  <section id="stages">
    <div class="stage"><b>scene</b><canvas id="scene"></canvas></div><div class="stage"><b>occlusion</b><canvas id="occlusion"></canvas></div><div class="stage"><b>emission</b><canvas id="emission"></canvas></div>
    <div class="stage"><b>seed</b><canvas id="seed"></canvas></div><div class="stage"><b>SDF</b><canvas id="sdf"></canvas></div><div class="stage"><b>radiance ×3</b><canvas id="radiance"></canvas></div><div class="stage"><b>final</b><canvas id="final"></canvas></div>
  </section><pre id="probes">waiting…</pre><script type="module" src="./main.ts"></script>
</body></html>

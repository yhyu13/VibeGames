<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM LEDGE — 棱镜断崖</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1330; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 0; left: 0; right: 0;
        padding: 12px 16px; color: #f5e9d0;
        font-family: system-ui, "Segoe UI", sans-serif;
        pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6);
      }
      #phase { font-size: 20px; font-weight: 700; letter-spacing: .04em; }
      #timer { margin-left: 12px; font-variant-numeric: tabular-nums; opacity: .9; }
      #hint {
        font-size: 13px; opacity: .8; margin-top: 4px; line-height: 1.5;
      }
      #center {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        color: #f5e9d0; font-family: system-ui, "Segoe UI", sans-serif;
        text-align: center; pointer-events: none;
      }
      #center h1 { font-size: 34px; margin: 0; letter-spacing: .06em; }
      #center button {
        pointer-events: auto; font-size: 18px; padding: 10px 26px; cursor: pointer;
        border: 1px solid #caa96a; border-radius: 8px; background: rgba(202,169,106,.18);
        color: #f5e9d0; font-family: inherit;
      }
      #center button:hover { background: rgba(202,169,106,.34); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <span id="phase">—</span><span id="timer"></span>
      <div id="hint"></div>
    </div>
    <div id="center"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Invader</title>
    <style>
      :root {
        --bg: #050610;
        --fg: #e8e8f0;
        --alien: #9b6cff;
        --alien-glow: #6cff9b;
        --warn: #ff5b6c;
        --cyber: #6cffff;
        --propaganda: #ffb86c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
      body { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 1; transition: opacity 0.4s; }
      #boot.hidden { opacity: 0; }
      #boot .panel { padding: 24px 32px; border: 1px solid var(--alien); background: rgba(5, 6, 16, 0.7); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="panel">INITIALIZING INVASION…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
